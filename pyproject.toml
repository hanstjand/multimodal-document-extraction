[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-document-extraction"
version = "0.0.1"
description = "Master's research on multimodal document extraction: method reproductions (Study 01: LAD-RAG), technical-domain evaluation, failure analysis, and proposed methods."
readme = "README.md"
# Environment: conda env `mmde`, Python 3.11 (D-006). Runtime dependencies are added only by the
# checkpoint that first needs them, each with a lower bound, and noted in RESEARCH_LOG (D-006).
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",  # CP-2.1: PDF page counts/text; later page rendering (as in LAD-RAG). AGPL-3.0.
    "bm25s>=0.2",  # CP-3.1: BM25 baseline, same library as the LAD-RAG paper (Lù, 2024). MIT.
    "networkx>=3.2",  # CP-4.2: LAD-RAG document graph + Louvain (as in the paper). BSD-3-Clause.
]

[project.optional-dependencies]
# CP-3.3 dense retrieval. Install torch first from the CUDA index (see README), then `pip install -e .[dense]`.
dense = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
]
# CP-4.3B local VLM ingestion (install torch/torchvision from the CUDA index first, see README).
vlm = [
    "torch>=2.4",
    "torchvision>=0.19",
    "pillow>=10",
    "transformers>=5.0",
]
# Presentation figures from committed results (scripts/make_weekly_meeting_figures.py).
figures = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"multimodal_document_extraction.studies.ladrag.prompts" = ["*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
