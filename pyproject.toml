[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-document-extraction"
version = "0.0.1"
description = "Master's research on multimodal document extraction: method reproductions (Study 01: LAD-RAG), technical-domain evaluation, failure analysis, and proposed methods."
readme = "README.md"
# Python version and dependencies are finalized in CP-0.3 (see docs/DECISIONS.md).
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
